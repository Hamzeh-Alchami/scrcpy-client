name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        # ubuntu-latest ships with the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk scrcpy-mirror.apk

      - name: Verify APK signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose scrcpy-mirror.apk
          "$BT/aapt2" dump badging scrcpy-mirror.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-mirror-apk
          path: scrcpy-mirror.apk

      # Publish a direct .apk download (GitHub artifacts are always zipped).
      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest scrcpy-mirror.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download scrcpy-mirror.apk on your phone and open it to install."
